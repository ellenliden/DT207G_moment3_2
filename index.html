<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista - Fetch API demo</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a href="./index.html" class="nav__link nav__link--active">Lista</a>
        <a href="./add.html" class="nav__link">Lägg till</a>
        <a href="./about.html" class="nav__link">Om</a>
      </nav>
    </header>

    <main class="container">
      <h1>Poster</h1>

      <section class="controls">
        <button id="refreshBtn" class="button">Uppdatera lista</button>
      </section>

      <section id="listSection" class="card">
        <ul id="itemsList" class="list"></ul>
        <div id="emptyState" class="muted" hidden>Inga poster hittades.</div>
      </section>

      <template id="itemTemplate">
        <li class="list__item">
          <div class="list__content">
            <strong class="item__title"></strong>
            <div class="item__meta muted"></div>
          </div>
          <div class="list__actions">
            <button class="button button--danger item__delete">Ta bort</button>
          </div>
        </li>
      </template>
    </main>

    <footer class="site-footer muted">
      <small>Frontend med Fetch API. Byggd med HTML/CSS/JS.</small>
    </footer>

    <script src="./assets/js/config.js" defer></script>
    <script src="./assets/js/api.js" defer></script>
    <script src="./assets/js/index.js" defer></script>
  </body>
</html>
